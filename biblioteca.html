<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Minhas provas — FlyLearn</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="styles.css">
<style>.chips{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;padding:36px 20px}.empty .big{font-size:2.4rem}.empty p{color:var(--ink-light);max-width:460px;margin:8px auto 18px}.empty .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.filters-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0 16px}</style></head>
<body>
<div class="app-shell"><aside class="sidebar"><a class="nav-brand" href="dashboard.html"><span class="dot"></span>FlyLearn</a><nav aria-label="Principal"><a href="dashboard.html"><span class="ic">🏠</span>Painel</a><a href="turmas.html"><span class="ic">👥</span>Turmas e alunos</a><a href="materias.html"><span class="ic">🗂️</span>Matérias</a><a href="questoes.html"><span class="ic">❓</span>Banco de questões</a><a href="gerador.html"><span class="ic">✏️</span>Montar prova</a><a href="biblioteca.html" class="active" aria-current="page"><span class="ic">📚</span>Minhas provas</a><a href="correcao.html"><span class="ic">🧾</span>Aplicações e correção</a><a href="perfil.html"><span class="ic">⚙️</span>Perfil</a></nav><div class="sidebar-foot"><a href="index.html"><span class="ic">↩</span>Sair</a></div></aside>
<main class="main"><div class="topbar"><div><h1>Minhas provas</h1><div class="topbar-sub">Veja, imprima e aplique suas provas.</div></div><div class="avatar" title="Professora">P</div></div>
<div class="content" id="c"></div></main></div>
<script src="app.js"></script>
<script>
/* prova (+ versao_prova): nome, descricao, materia, nº de questões, versões (código), criada em */
function draw(){
  const c=$('#c');
  if(!DB.provas.length){
    c.innerHTML=`<div class="panel empty"><div class="big">📚</div><h2>Nenhuma prova ainda</h2>
    <p>Monte sua primeira prova (precisa de 10 questões ativas) ou crie um exemplo pronto para testar.</p>
    <div class="row"><a class="btn-generate" href="gerador.html" style="text-decoration:none">✏️ Montar uma prova</a><button class="btn-small" onclick="exemplo()">✨ Criar exemplo</button></div></div>`;return}
  c.innerHTML=`<div class="panel"><div class="panel-head"><h2>Minhas provas</h2><a class="btn-generate" href="gerador.html" style="text-decoration:none">+ Nova prova</a></div>
  <div class="recent-list">${DB.provas.map(p=>{const vs=DB.versoes.filter(v=>v.prova_id==p.id);return `<div class="recent-item" style="flex-wrap:wrap">
    <div class="ri-main"><div class="ri-ic">📄</div><div><h4>${esc(p.nome)}</h4><div class="meta">${esc(by('materias',p.materia_id)?.nome||'')} · ${p.qids.length} questões · criada em ${fmt(p.created_at)}</div>
    <div class="chips" style="margin-top:8px">${vs.map(v=>`<button class="btn-small" onclick="ver(${v.id})" title="Ver a prova">${v.codigo}</button>`).join('')}</div>
    ${vs.length?`<div class="chips" style="margin-top:8px"><button class="btn-generate" style="padding:9px 16px;font-size:.86rem" onclick="imprimirProvas([${vs.map(v=>v.id)}])">🖨 Imprimir provas (PDF)</button><button class="btn-small" onclick="imprimirGabaritos([${vs.map(v=>v.id)}])">🖨 Imprimir gabaritos (PDF)</button></div>`:''}</div></div>
    <div class="chips"><button class="btn-small" onclick="aplicar(${p.id})">Aplicar</button><a class="btn-small" href="gerador.html?prova=${p.id}">+ Versão</a><button class="btn-icon-del" onclick="del(${p.id})">Excluir</button></div></div>`}).join('')}</div>
  <p class="form-hint" style="margin-top:14px">Os botões de impressão abrem a janela do navegador: em “Destino”, escolha <b>Salvar como PDF</b> (ou sua impressora). Clique no código de uma versão para ver uma só.</p></div>`;
}
function exemplo(){criarExemplo();draw()}
function del(pid){
  const vs=DB.versoes.filter(v=>v.prova_id==pid).map(v=>v.id);
  if(DB.avaliacoes.some(a=>vs.includes(a.versao_prova_id)))return alert('Esta prova já foi aplicada a alunos e não pode ser excluída.');
  if(!confirm('Excluir esta prova e suas versões?'))return;
  DB.versoes=DB.versoes.filter(v=>v.prova_id!=pid);DB.provas=DB.provas.filter(p=>p.id!=pid);save();draw();
}
function ver(i){const v=by('versoes',i),p=by('provas',v.prova_id);
  modal(`<div class="worksheet"><div class="ws-header"><div class="ws-title">${esc(p.nome)}</div><div class="ws-meta"><span>Versão <b>${v.codigo}</b></span><span>Nome: ____________ RA: ______</span></div></div>${v.itens.map(it=>{const q=by('questoes',it.questao_id);return `<div class="question"><div class="q-head"><span class="q-num">${it.ordem}.</span></div><div class="q-text">${esc(q.enunciado)}</div><ul class="options">${it.alts.map((a,k)=>`<li><span class="letter">${L[k]}</span>${esc(q.alts.find(x=>x.id==a).texto)}</li>`).join('')}</ul></div>`}).join('')}</div>
  <div class="panel" style="margin-top:16px"><b>Gabarito:</b> ${gab(v).map((l,k)=>(k+1)+l).join(' · ')}<div class="form-actions" style="justify-content:flex-start"><button class="btn-generate" onclick="imprimirProvas([${v.id}])">🖨 Prova (PDF)</button><button class="btn-small" onclick="imprimirGabaritos([${v.id}])">🖨 Gabarito (PDF)</button></div></div>`)}
function aplicar(pid){modal(`<div class="modal-form-card"><h2>Aplicar prova</h2><p class="sub">Cria uma avaliação para cada aluno da turma, distribuindo as versões.</p><div class="field"><label>Turma</label><select id="at">${opts('turmas',t=>t.ano+'º ano · '+t.disciplina)}</select></div><div class="field" style="margin-top:12px"><label>Data da aplicação</label><input type="text" id="ad" value="${new Date().toISOString().slice(0,10)}"></div><div class="form-actions"><button class="btn-generate" onclick="ok(${pid})">Aplicar</button></div></div>`)}
function ok(pid){const vs=DB.versoes.filter(v=>v.prova_id==pid),al=DB.alunos.filter(a=>a.turma_id==$('#at').value);if(!al.length)return alert('Essa turma ainda não tem alunos. Cadastre em Turmas e alunos.');
  al.forEach((a,i)=>DB.avaliacoes.push({id:id(),versao_prova_id:vs[i%vs.length].id,aluno_id:a.id,data_aplicacao:$('#ad').value,status:'aplicada',nota:null,data_correcao:null,respostas:[]}));save();location.href='correcao.html'}
draw();
</script>
</body></html>
