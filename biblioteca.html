<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas provas — FlyLearn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="nav-brand" href="dashboard.html"><span class="dot"></span>FlyLearn</a>
      <nav aria-label="Principal">
        <a href="dashboard.html"><span class="ic">🏠</span>Painel</a>
        <a href="turmas.html"><span class="ic">👥</span>Turmas e alunos</a>
        <a href="materias.html"><span class="ic">🗂️</span>Matérias</a>
        <a href="questoes.html"><span class="ic">❓</span>Banco de questões</a>
        <a href="gerador.html"><span class="ic">✏️</span>Montar prova</a>
        <a href="biblioteca.html" class="active" aria-current="page"><span class="ic">📚</span>Minhas provas</a>
        <a href="correcao.html"><span class="ic">🧾</span>Aplicações e correção</a>
        <a href="perfil.html"><span class="ic">⚙️</span>Perfil</a>
      </nav>
      <div class="sidebar-foot">
        <a href="index.html"><span class="ic">↩</span>Sair</a>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>Minhas provas</h1>
          <div class="topbar-sub">Veja, imprima e aplique suas provas.</div>
        </div>
        <div class="avatar" title="Professora">P</div>
      </div>
      <div class="content" id="c"></div>
    </main>
  </div>

  <script>
    /* prova (+ versao_prova): nome, descricao, materia, nº de questões, versões (código), criada em.
       Agora conversando direto com o backend (Django). API_BASE/PROF/api() vêm do app.js. */
    let provasCache = [], materiasCache = [];
    const materiaNome = i => materiasCache.find(m => m.id == i)?.nome || '';

    async function draw() {
      const c = $('#c');
      try {
        [provasCache, materiasCache] = await Promise.all([
          api('/provas/?professor_id=' + PROF.id, {}),
          api('/materias/?professor_id=' + PROF.id, {}),
        ]);
      } catch (e) {
        c.innerHTML = `<div class="panel"><p class="sub">Erro ao carregar: ${esc(e.message)}</p></div>`;
        return;
      }

      if (!provasCache.length) {
        c.innerHTML = `
          <div class="panel empty">
            <div class="big">📚</div>
            <h2>Nenhuma prova ainda</h2>
            <p>Monte sua primeira prova no Banco de questões + Montar prova.</p>
            <div class="row">
              <a class="btn-generate" href="gerador.html" style="text-decoration:none">✏️ Montar uma prova</a>
            </div>
          </div>
        `;
        return;
      }

      c.innerHTML = `
        <div class="panel">
          <div class="panel-head">
            <h2>Minhas provas</h2>
            <a class="btn-generate" href="gerador.html" style="text-decoration:none">+ Nova prova</a>
          </div>
          <div class="recent-list">
            ${provasCache.map(p => {
              const vs = p.versoes || [];
              return `
                <div class="recent-item" style="flex-wrap:wrap">
                  <div class="ri-main">
                    <div class="ri-ic">📄</div>
                    <div>
                      <h4>${esc(p.nome)}</h4>
                      <div class="meta">${esc(materiaNome(p.materia_id))} ·${p.n_questoes} questões · criada em ${fmt(p.created_at)}</div>
                      <div class="chips" style="margin-top:8px">
                        ${vs.map(v => `<button class="btn-small" onclick="ver(${v.id})" title="Ver a prova">${esc(v.codigo)}</button>`).join('')}
                      </div>
                      ${vs.length ? `
                        <div class="chips" style="margin-top:8px">
                          <button class="btn-generate" style="padding:9px 16px;font-size:.86rem" onclick="imprimirVersoesProvaApi([${vs.map(v => v.id)}],'${esc(p.nome)}')">🖨 Imprimir provas (PDF)</button>
                          <button class="btn-small" onclick="imprimirGabaritosProvaApi([${vs.map(v => v.id)}],'${esc(p.nome)}')">🖨 Imprimir gabaritos (PDF)</button>
                        </div>
                      ` : ''}
                    </div>
                  </div>
                  <div class="chips">
                    <button class="btn-small" onclick="aplicar(${p.id})">Aplicar</button>
                    <a class="btn-small" href="gerador.html?prova=${p.id}">+ Versão</a>
                    <button class="btn-icon-del" onclick="del(${p.id})">Excluir</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <p class="form-hint" style="margin-top:14px">
            Os botões de impressão abrem a janela do navegador: em "Destino", escolha <b>Salvar como PDF</b> (ou sua impressora). Clique no código de uma versão para ver uma só.
          </p>
        </div>
      `;
    }

    async function del(pid) {
      if (!confirm('Excluir esta prova e suas versões?')) return;
      try {
        await api('/provas/' + pid + '/', { method: 'DELETE' });
        draw();
      } catch (e) {
        alert(e.message);
      }
    }

    async function ver(i) {
      let v;
      try {
        v = await api('/versoes/' + i + '/completa/', {});
      } catch (e) {
        return alert(e.message);
      }
      modal(`
        <div class="worksheet">
          <div class="ws-header">
            <div class="ws-title">${esc(v.prova_nome)}</div>
            <div class="ws-meta">
              <span>Versão <b>${esc(v.codigo)}</b></span>
              <span>Nome: ____________ RA: ______</span>
            </div>
          </div>
          ${v.itens.map(it => `
            <div class="question">
              <div class="q-head"><span class="q-num">${it.ordem}.</span></div>
              <div class="q-text">${esc(it.enunciado)}</div>
              <ul class="options">
                ${it.alternativas.map((t, k) => `<li><span class="letter">${L[k]}</span>${esc(t)}</li>`).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
        <div class="panel" style="margin-top:16px">
          <b>Gabarito:</b> ${v.itens.map(it => it.ordem + (it.correta_letra || '—')).join(' · ')}
          <div class="form-actions" style="justify-content:flex-start">
            <button class="btn-generate" onclick="imprimirVersoesProvaApi([${v.id}],'${esc(v.prova_nome)}')">🖨 Prova (PDF)</button>
            <button class="btn-small" onclick="imprimirGabaritosProvaApi([${v.id}],'${esc(v.prova_nome)}')">🖨 Gabarito (PDF)</button>
          </div>
        </div>
      `);
    }

    async function aplicar(pid) {
      let turmas;
      try {
        turmas = (await api('/turmas/?professor_id=' + PROF.id, {})).turmas || [];
      } catch (e) {
        return alert(e.message);
      }
      if (!turmas.length) return alert('Cadastre uma turma antes, em Turmas e alunos.');
      modal(`
        <div class="modal-form-card">
          <h2>Aplicar prova</h2>
          <p class="sub">Cria uma avaliação para cada aluno da turma, distribuindo as versões.</p>
          <div class="field">
            <label>Turma</label>
            <select id="at">
              ${turmas.map(t => `<option value="${t.id}">${t.ano}º ano · ${esc(t.disciplina)}</option>`).join('')}
            </select>
          </div>
          <div class="field" style="margin-top:12px">
            <label>Data da aplicação</label>
            <input type="date" id="ad" value="${new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)}">
          </div>
          <div class="error-box" id="ae"></div>
          <div class="form-actions">
            <button class="btn-generate" onclick="ok(${pid})">Aplicar</button>
          </div>
        </div>
      `);
    }

    async function ok(pid) {
      const btn = event.target;
      btn.disabled = true;
      try {
        await api('/provas/' + pid + '/aplicar/', {
          method: 'POST',
          body: JSON.stringify({
            turma_id: $('#at').value,
            data_aplicacao: $('#ad').value
          })
        });
        location.href = 'correcao.html';
      } catch (e) {
        const box = $('#ae');
        if (box) {
          box.textContent = e.message;
          box.classList.add('show');
        } else {
          alert(e.message);
        }
        btn.disabled = false;
      }
    }

    draw();
  </script>
</body>
</html>
