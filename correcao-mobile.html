<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Correção — FlyLearn</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html,body{margin:0}
    body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
    .m-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:#fff;border-bottom:1px solid #e6e9ef}
    .m-top h1{font-size:1.15rem;margin:0}
    .m-top a{font-size:.85rem;color:#1f4fd8;text-decoration:none}
    .m-main{padding:14px 14px 0;display:grid;gap:14px}
    .m-main .panel{margin:0;padding:16px;border-radius:14px}
    .m-main .form-grid{display:grid;grid-template-columns:1fr;gap:12px}
    .m-main select,.m-main input{width:100%;min-height:46px;font-size:16px;box-sizing:border-box}
    .m-main .btn-generate{width:100%;min-height:48px;font-size:1rem}
    .tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
    .tab{flex:none;padding:9px 16px;border:1px solid #d5d9e0;background:#fff;border-radius:999px;font:inherit}
    .tab.active{background:#1f4fd8;border-color:#1f4fd8;color:#fff}
    #tb{display:grid;gap:10px}
    .ap-card{border:1px solid #e6e9ef;border-radius:12px;padding:14px;display:grid;gap:4px}
    .ap-card.sel{border-color:#1f4fd8;background:#eef3ff}
    .ap-top{display:flex;justify-content:space-between;gap:10px}
    .ap-nota{font-weight:700;font-size:1.2rem}
    .ap-meta{font-size:.88rem;opacity:.75}
    .ap-card .btn-generate{margin-top:8px}
    .empty-note{padding:24px;text-align:center;opacity:.65}
    .link-btn{border:0;background:none;color:#1f4fd8;font:inherit;text-decoration:underline}
    .alvo{font-size:.92rem;margin:0 0 12px}
    .success-box{display:none}
    .m-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #e6e9ef;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
    .m-nav a{display:grid;justify-items:center;gap:2px;padding:9px 0;font-size:.7rem;color:#5b6475;text-decoration:none}
    .m-nav a.active{color:#1f4fd8;font-weight:600}
    .m-nav .ic{font-size:1.3rem}
    /* scanner em coluna única, câmera maior */
    .scan-grid{grid-template-columns:1fr!important}
    .scan-stage{aspect-ratio:3/4!important}
    .scan-actions button{flex:1;min-height:48px;font-size:1rem}
  </style>
</head>
<body data-mobile="1">
  <header class="m-top">
    <h1>Aplicações e correção</h1>
    <a href="correcao.html">Versão completa</a>
  </header>

  <main class="m-main">
    <section class="panel">
      <h2>Aplicar prova</h2>
      <p class="sub">Cria uma avaliação para cada aluno, com as versões distribuídas.</p>
      <div class="form-grid">
        <div class="field"><label for="ap">Prova</label><select id="ap"></select></div>
        <div class="field"><label for="ad">Data da aplicação</label><input type="date" id="ad"></div>
        <div class="field"><label for="at">Turma</label><select id="at"></select></div>
        <div class="field"><label for="aa">Aluno</label><select id="aa"></select></div>
      </div>
      <div class="error-box" id="err"></div>
      <div class="success-box" id="okb"></div>
      <div class="form-actions"><button type="button" class="btn-generate" id="apl">Aplicar prova</button></div>
    </section>

    <section class="panel">
      <h2>Avaliações</h2>
      <p class="sub" id="resumo"></p>
      <div class="tabs" id="tabs"></div>
      <div id="tb"></div>
    </section>

    <div id="scanMount"><p class="alvo" id="alvo"></p></div>
  </main>

  <nav class="m-nav" aria-label="Principal">
    <a href="dashboard.html"><span class="ic">🏠</span>Painel</a>
    <a href="turmas.html"><span class="ic">👥</span>Turmas</a>
    <a href="biblioteca.html"><span class="ic">📚</span>Provas</a>
    <a href="correcao-mobile.html" class="active" aria-current="page"><span class="ic">🧾</span>Correção</a>
    <a href="perfil.html"><span class="ic">⚙️</span>Perfil</a>
  </nav>

  <script src="app.js"></script>
  <script src="correcao.js"></script>
  <script src="omr-scan.js"></script>
</body>
</html>
