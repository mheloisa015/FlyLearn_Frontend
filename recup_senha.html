<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha — FlyLearn</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="auth-wrap">
        <div class="chalk-dust"></div>
        <a href="login.html" class="auth-back">← Voltar para o login</a>
        <section class="auth-card">
            <div class="auth-brand">
                <span class="dot"></span>
                FlyLearn
            </div>
            <h1>Recuperar senha</h1>
            <p class="sub">
                Informe seu e-mail para receber o código de recuperação.
            </p>
            <form id="recoveryForm">
                <div class="auth-fields">
                    <div class="field">
                        <label for="recoveryEmail">
                            E-mail
                        </label>
                        <input type="email" id="recoveryEmail" name="recoveryEmail" placeholder="seu@email.com" required>
                    </div>
                </div>
                <div class="form-actions form-actions-full">
                    <button type="submit" class="btn-generate">Enviar código</button>
                </div>
            </form>
            <div class="auth-foot">
                <a href="login.html">Voltar para o login</a>
            </div>
        </section>
    </main>
    <script>
        const recoveryForm = document.getElementById("recoveryForm");
        recoveryForm.addEventListener("submit", function(event) {
            event.preventDefault();
            const email = document.getElementById("recoveryEmail").value;
            console.log("Código enviado para:", email);
        });
    </script>
</body>
</html>
