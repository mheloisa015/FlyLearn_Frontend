<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — FlyLearn</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="auth-wrap">
        <div class="chalk-dust"></div>
        <a href="index.html" class="auth-back">← Voltar</a>
        <section class="auth-card">
            <div class="auth-brand"><img class="logo-full" src="img/logo-completo.png" alt="FlyLearn" height="56"></div>
            <h1>Entrar</h1>
            <p class="sub">Acesse sua conta para continuar.</p>
            <form id="loginForm">
                <div class="auth-fields">
                    <div class="field">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="off" required>
                    </div>
                    <div class="field">
                        <label for="password">Senha</label>
                        <div class="password-field">
                            <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                            <button type="button" class="password-toggle" id="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
                                <svg class="password-icon password-icon-closed" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.7 10.7 0 0 1 12 5c5.2 0 8.6 5 9.5 7a17.8 17.8 0 0 1-3.1 4.2M6.2 6.2C3.9 7.7 2.7 10 2.5 12c.5 1.1 1.8 3.2 4.3 4.8A10.6 10.6 0 0 0 12 19c1.1 0 2.1-.2 3-.5"/>
                                </svg>
                                <svg class="password-icon password-icon-open" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"/>
                                    <circle cx="12" cy="12" r="2.5"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div style="text-align: right; margin-top: 6px;">
                        <a href="recup_senha.html" style="font-size: 12px;">Esqueci minha senha</a>
                    </div>
                </div>
                <div class="form-actions form-actions-full form-actions-login">
                    <button type="submit" class="btn-generate">Entrar</button>
                </div>
            </form>
            <div class="auth-foot">
                Ainda não possui uma conta?
                <a href="cadastro.html">Criar conta</a>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
    <script>
        const API = ['localhost', '127.0.0.1'].includes(location.hostname)
        ? 'https://flylearn.onrender.com'
        : '/api';

        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('toggle-password');

        passwordToggle.addEventListener('click', () => {
            const showingPassword = passwordInput.type === 'password';
            passwordInput.type = showingPassword ? 'text' : 'password';
            passwordToggle.setAttribute('aria-label', showingPassword ? 'Ocultar senha' : 'Mostrar senha');
            passwordToggle.setAttribute('aria-pressed', String(showingPassword));
            passwordToggle.classList.toggle('is-visible', showingPassword);
        });

        document.getElementById('loginForm').addEventListener('submit', async function name(e) {
            e.preventDefault();
            const bnt = this.querySelector('button[type=submit]');
            bnt.disabled = true;
            bnt.textContent = 'Entrando ... ';
            try{
                const r= await fetch(API + '/login/',{
                    method: 'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        email:document.getElementById('email').value,
                        senha: document.getElementById('password').value
                    })
                });
            const dados = await r.json().catch(()=>({}));
            if(!r.ok){toast(dados.erro || 'Não foi possível entrar.'); return;}
            localStorage.setItem('flylearn_user', JSON.stringify(dados));
            window.location.href= 'dashboard.html'
            } catch (err){
                toast('Opss! Algo de errado aconteceu, tente novamente em instantes!');
            } finally{
                bnt.disabled = false;
                bnt.textContent = 'Entrar';
            }
        });
    </script>
</body>

</html>
