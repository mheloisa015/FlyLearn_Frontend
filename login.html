<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — FlyLearn</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="auth-wrap">
        <div class="chalk-dust"></div>
        <a href="index.html" class="auth-back">← Voltar</a>
        <section class="auth-card">
            <div class="auth-brand"><img class="logo-full" src="img/logo-completo.png" alt="FlyLearn" height="56"></div>
            <h1>Entrar</h1>
            <p class="sub">Acesse sua conta para continuar.</p>
            <form id="loginForm">
                <div class="auth-fields">
                    <div class="field">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="off" required>
                    </div>
                    <div class="field">
                        <label for="password">Senha</label>
                        <div class="pw-wrap">
                            <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="new-password" required>
                            <button type="button" class="pw-toggle" data-alvo="password" aria-label="Mostrar senha" aria-pressed="false"></button>
                        </div>
                    </div>
                    <div style="text-align: right; margin-top: 6px;">
                        <a href="recup_senha.html" style="font-size: 12px;">Esqueci minha senha</a>
                    </div>
                </div>
                <div class="form-actions form-actions-full form-actions-login">
                    <button type="submit" class="btn-generate">Entrar</button>
                </div>
            </form>
            <div class="auth-foot">
                Ainda não possui uma conta?
                <a href="cadastro.html">Criar conta</a>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
    <script>
        const API = window.FLYLEARN_API || (
            ['localhost', '127.0.0.1'].includes(location.hostname)
                ? 'http://127.0.0.1:8000'
                : '/api'
        );

        document.getElementById('loginForm').addEventListener('submit', async function name(e) {
            e.preventDefault();
            const bnt = this.querySelector('button[type=submit]');
            bnt.disabled = true;
            bnt.textContent = 'Entrando ... ';
            try{
                const r= await fetch(API + '/login/',{
                    method: 'POST',
                    credentials: 'include',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        email:document.getElementById('email').value,
                        senha: document.getElementById('password').value
                    })
                });
            const dados = await r.json().catch(()=>({}));
            if(!r.ok){toast(dados.erro || 'Não foi possível entrar.'); return;}
            localStorage.setItem('flylearn_user', JSON.stringify(dados));
            window.location.href= 'dashboard.html'
            } catch (err){
                toast('Opss! Algo de errado aconteceu, tente novamente em instantes!');
            } finally{
                bnt.disabled = false;
                bnt.textContent = 'Entrar';
            }
        });
    </script>
    <script>
        function atualizarIconeSenha(button, mostrar) {
            button.innerHTML = mostrar
                ? '<svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>'
                : '<svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13c2.5-2.5 5.5-3.5 9-3.5s6.5 1 9 3.5"></path></svg>';
        }

        document.querySelectorAll('.pw-toggle').forEach(function (button) {
            atualizarIconeSenha(button, false);
            button.addEventListener('click', function () {
                const input = document.getElementById(button.dataset.alvo);
                const mostrar = input.type === 'password';
                input.type = mostrar ? 'text' : 'password';
                button.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
                button.setAttribute('aria-pressed', String(mostrar));
                atualizarIconeSenha(button, mostrar);
            });
        });
    </script>
</body>

</html>
