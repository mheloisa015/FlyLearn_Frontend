<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — FlyLearn</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="auth-wrap">
        <div class="chalk-dust"></div>
        <a href="index.html" class="auth-back">← Voltar</a>
        <section class="auth-card">
            <div class="auth-brand"><span class="dot"></span>FlyLearn</div>
            <h1>Entrar</h1>
            <p class="sub">Acesse sua conta para continuar.</p>
            <form id="loginForm">
                <div class="auth-fields">
                    <div class="field">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com"required>
                    </div>
                    <div class="field">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    </div>
                    <div style="text-align: right; margin-top: 6px;">
                        <a href="recup_senha.html" style="font-size: 12px;">Esqueci minha senha</a>
                    </div>
                </div>
                <div class="form-actions form-actions-full form-actions-login">
                    <button type="submit" class="btn-generate">Entrar</button>
                </div>
            </form>
            <div class="auth-foot">
                Ainda não possui uma conta?
                <a href="cadastro.html">Criar conta</a>
            </div>
        </section>
    </main>
    <script>
        if (localStorage.getItem('flylearn_user')) 
            location.replace('dashboard.html');
        const API = ['localhost', '127.0.0.1'].includes(location.hostname)
        ? 'https://flylearn.onrender.com'
        : '/api';

        document.getElementById('loginForm').addEventListener('submit', async function name(e) {
            e.preventDefault();
            const bnt = this.querySelector('button[type=submit]');
            bnt.disabled = true; 
            bnt.textContent = 'Entrando ... ';
            try{
                const r= await fetch(API + '/login/',{
                    method: 'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        email:document.getElementById('email').value,
                        senha: document.getElementById('password').value
                    })
                });
            const dados = await r.json().catch(()=>({}));
            if(!r.ok){alert(dados.erro || 'Não foi possível entrar.'); return;}
            localStorage.setItem('flylearn_user', JSON.stringify(dados));
            window.location.href= 'dashboard.html'
            } catch (err){
                alert('Opss! Algo de errado aconteceu , tente novamente em instantes!');
            } finally{
                bnt.disabled = false; 
                bnt.textContent = 'Entrar';
            }
        });
    </script>
</body>

</html>
