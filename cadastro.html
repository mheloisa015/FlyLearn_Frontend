<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — FlyLearn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-wrap">
  <div class="chalk-dust"></div>
  <a href="index.html" class="auth-back">← Voltar ao site</a>
  <div class="auth-card">
    <a class="auth-brand" href="index.html"><span class="dot"></span>FlyLearn</a>
    <h1>Criar conta gratuita</h1>
    <p class="sub">Leva menos de um minuto. </p>
    <form id="cadastro-form">
      <div class="auth-fields">
        <div class="field"><label for="nome">Nome completo</label><input type="text" id="nome" required placeholder="Seu nome"></div>
        <div class="field"><label for="email2">E-mail</label><input type="email" id="email2" required placeholder="voce@escola.com.br"></div>
        <div class="field"><label for="senha2">Senha</label><input type="password" id="senha2" required placeholder="Crie uma senha"></div>
      </div>
      <div class="form-actions" style="margin-top:24px;">
        <button type="submit" class="btn-generate" style="width:100%;justify-content:center;">Criar conta</button>
      </div>
    </form>
    <div class="auth-foot">Já tem conta? <a href="login.html">Entrar</a></div>
  </div>
</div>


<script>
document.getElementById('cadastro-form').addEventListener('submit', function(e){
  e.preventDefault();
  window.location.href = 'dashboard.html';
});
</script>

</body>
</html>
