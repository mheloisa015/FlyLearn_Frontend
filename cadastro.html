<!DOCTYPE html>
<html lang="pt-BR">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — FlyLearn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
<body>

  <div class="auth-wrap">
    <div class="chalk-dust"></div>
    <a href="index.html" class="auth-back">← Voltar ao site</a>
    <div class="auth-card">
      <a class="auth-brand" href="index.html"><span class="dot"></span>FlyLearn</a>
      <h1>Criar conta gratuita</h1>
      <p class="sub">Leva menos de um minuto. </p>
      <form id="cadastro-form">
        <div class="auth-fields">
          <div class="field"><label for="nome">Nome completo</label><input type="text" id="nome" required placeholder="Seu nome"></div>
          <div class="field"><label for="email2">E-mail</label><input type="email" id="email2" required placeholder="voce@escola.com.br"></div>
          <div class="field"><label for="senha2">Senha</label><input type="password" id="senha2" required placeholder="Crie uma senha"></div>
        </div>
        <div class="form-actions" style="margin-top:24px;">
          <button type="submit" class="btn-generate" style="width:100%;justify-content:center;">Criar conta</button>
        </div>
      </form>
      <div class="auth-foot">Já tem conta? <a href="login.html">Entrar</a></div>
    </div>
  </div>


  <script>
    const API = ['localhost', '127.0.0.1'].includes(location.hostname)
    ? 'https://flylearn.onrender.com'
    : '/api';

    document.getElementById=('cadastro-form').addEventListener('submit',async function(e) {
      e.preventDefault();
      const bnt = this.querySelector('button[type=submit]');
      bnt.disabled = true; bnt.textContent = 'Cirando...';
      try{
        const r = await fetch(API + '/professores/',{
          method : 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            nome: document.getElementById('nome').value,
            email: document.getElementById('email2').value,
            senha: document.getElementById('senha2').value
          })
        });
        const dados = await r.json().catch(() =>({}));
        if(!r.ok){alert(dados.erro|| 'Não foi possível criar a conta.'); return;}
        window.location.href = 'dashboard.html';
      }catch(err){
        alert("Opps! Algo de errado aconteceu, tente novamente mais tarde!")
      } finally {
        bnt.disabled = false; bnt.textContent = 'Criar conta';
      }
    });
  </script>

</body>
</html>
